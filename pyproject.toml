[tool.poetry]
name = "cookieblueprint"
version = "0.0.0" # Version is ignored and set by Tekton. Use pipeline to increase.
description = "Copier template for a basic python codebase"
authors = ["Haefelin Julien <julien.haefelin@gmail.com>"]
repository = "https://github.com/Julien-hae/CookieBlueprint.git"
documentation = "https://github.com/Julien-hae/CookieBlueprint/blob/master/README.md"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "~3.11"
copier = "~9.17"                                    # Library and CLI to render project templates and to keep generated projects up to date with the template.
tomli = "~2.0"                                      # A lil' TOML parser
pyyaml = "~6.0"                                     # YAML parser and emitter for Python

[tool.poetry.group.dev.dependencies]
coverage = {extras = ["toml"], version = "~7.6.0"}    # Code coverage measurement for Python
unittest-xml-reporting = "~3.2"                     # unittest-based test runner with Ant/JUnit like XML reporting.
pre-commit = "~4.0.0"                                 # A framework for managing and maintaining multi-language pre-commit hooks.
pre-commit-hooks = "~5.0.0"                           # Some out-of-the-box hooks for pre-commit.
ruff = "^0.14.14"                                   # Extremely fast Python linter and formatter, replaces black/isort/pydocstyle/pylint

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# `ruff format` reformats to this width; black's default is kept so the migration
# doesn't rewrap every existing file.
line-length = 88
target-version = "py311"
src = ["tests"]
# The template directory holds Jinja, not Python: `template/src/{{ package_name }}`
# is not an importable path and the sources there do not parse as Python.
extend-exclude = ["template"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "PL",   # pylint
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.pycodestyle]
max-line-length = 140  # E501 stays as lenient as pylint's max-line-length was

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",        # tests don't need docstrings, as pydocstyle's match-dir used to skip them
    "PLR2004",  # magic values are fine in assertions
]

[tool.coverage.run]
command_line = "-m xmlrunner discover --output-file junittest.xml"
