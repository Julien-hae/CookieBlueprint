repos:
  - repo: local
    hooks:
      - id: poetry-check
        name: poetry-check
        description: run poetry check to validate config
        entry: poetry check
        language: system
        pass_filenames: false
        files: (^|/)pyproject.toml$

      - id: trailing-whitespace-fixer
        name: trailing-whitespace-fixer
        entry: trailing-whitespace-fixer
        language: python
        types: [text]

      - id: end-of-file-fixer
        name: end-of-file-fixer
        entry: end-of-file-fixer
        language: python
        types: [text]

      - id: ruff_formatter
        name: ruff_formatter
        description: "Run 'ruff format' for extremely fast Python formatting"
        entry: ruff format
        # the template sources are Jinja, not Python: their pyproject.toml is not
        # valid TOML and ruff would abort trying to read it as configuration
        exclude: '^\{\{ cookiecutter\.slugname \}\}/'
        args: ["--force-exclude"]
        types_or: [python]
        language: python

      - id: ruff_linter
        name: ruff_linter
        description: "Run 'ruff' for extremely fast Python linting"
        entry: ruff check
        exclude: '^\{\{ cookiecutter\.slugname \}\}/'
        args:
          [
            "--force-exclude",
            "--fix",
            "--output-file",
            "sonar_report.json",
            "--output-format",
            "json",
          ]
        types_or: [python]
        language: python

      - id: unittest-run
        name: unittest-run
        entry: coverage run
        pass_filenames: false
        language: system
        files: '\.py$'
